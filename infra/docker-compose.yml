# Standalone Den stack for Docker Desktop.
#
# Host port mapping (chosen so Den can coexist with Stash on the same box):
#
#   backend   8090 → 8080 (container listens on :8080 for consistency with
#                           Stash and K8s; HTTP_ADDR is forced here.)
#   frontend  3001 → 80
#   postgres  5434 → 5432
#   minio     9010 → 9000 (API)      — DEV ONLY
#   minio     9011 → 9001 (console)  — DEV ONLY
#
# A root compose that includes Den + Stash can keep the SAME container
# ports (:8080, :5432, :9000) because container networks don't collide;
# it only has to remap the HOST side.
#
# Startup ordering:
#   1. postgres          healthchecked
#   2. minio             started
#   3. migrate           one-shot (restart: no) — must exit 0 before backend starts
#   4. backend           depends on migrate (service_completed_successfully)
#   5. frontend          depends on backend

name: den

services:
  postgres:
    image: postgres:16-alpine
    container_name: den-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: den
      POSTGRES_PASSWORD: den
      POSTGRES_DB: den
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U den -d den"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO is LOCAL / Docker Desktop development ONLY.
  # NEVER use MinIO in production — point S3_* at real S3-compatible object
  # storage. See docs/adr/0003-minio-dev-only.md.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: den-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: den
      MINIO_ROOT_PASSWORD: denden123
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data

  # One-shot migration runner. `restart: no` plus a backend `depends_on`
  # with `service_completed_successfully` keeps the API from starting
  # against an un-migrated DB. Replicas scaling in production will NOT
  # fight over the Goose version table — only this job ever runs it.
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: den-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://den:den@postgres:5432/den?sslmode=disable
    entrypoint: ["/den-migrate"]
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: den-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      # Base URL baked into pairing URLs; from the module's point of view
      # it needs to be reachable, so we use the host-visible port 8090.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8090}
      # Inside the container we always listen on :8080 to match Stash and
      # k8s manifests; host port 8090 is just the port forward.
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://den:den@postgres:5432/den?sslmode=disable
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-den-data-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-den}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-denden123}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      AUTH_MODE: ${AUTH_MODE:-dev}
      DEV_DEFAULT_USER: dev-admin
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-den-keycloak}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3001
    ports:
      - "8090:8080"

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        # Same-origin API in the compose stack — nginx proxies /api/ to
        # the backend service, so the SPA bundle carries VITE_API_BASE_URL=''.
        VITE_API_BASE_URL: ""
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-dev}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
    container_name: den-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  postgres-data:
  minio-data:
