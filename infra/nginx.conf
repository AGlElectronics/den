# nginx config for the Den SPA container. Serves the static bundle and
# reverse-proxies /api/ to the backend service. Backend inside the compose
# network listens on :8080 regardless of what host port we publish; see
# docker-compose.yml for host port mapping (host 8090 → container 8080).

upstream den_backend {
    server backend:8080;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy. The SPA calls relative /api/... so the same origin
    # serves both static assets and the API; this avoids CORS entirely in
    # the production bundle.
    location /api/ {
        proxy_pass http://den_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass_request_headers on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Removing a module backs its database up before dropping it.
    location ~ ^/api/v1/modules/[^/]+$ {
        proxy_pass http://den_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30m;
        proxy_buffering off;
    }

    # Installation settings of the web app (sign-in address and the like),
    # mounted at /etc/conservices. Never cached, so a change shows on reload.
    location = /config.json {
        alias /etc/conservices/config.json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Hashed assets emitted by rsbuild can be cached forever.
    location /static/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback. All unknown URLs fall through to index.html so TanStack
    # Router can resolve them on the client.
    # Target of the hidden sign-in iframe (oidc-client-ts silent renew),
    # framed by Den itself, so it gets the same-origin-frameable headers.
    location = /silent-callback.html {
        include /etc/nginx/snippets/security-headers-frameable.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
